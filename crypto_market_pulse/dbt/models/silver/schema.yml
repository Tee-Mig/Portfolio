version: 2

models:
  - name: stg_prices
    description: Deduplicated hourly price records with technical indicators
    columns:
      - name: coin_id
        tests:
          - not_null
      - name: current_price
        tests:
          - not_null
      - name: rsi
        tests:
          - not_null

  - name: stg_sentiment
    description: Deduplicated hourly Fear & Greed scores with sentiment_index and label
    columns:
      - name: coin_id
        tests:
          - not_null
      - name: sentiment_label
        tests:
          - accepted_values:
              values: ['bullish', 'bearish', 'neutral']
